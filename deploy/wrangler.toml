name = "yaohao-lottery"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# 静态资源（页面）
[assets]
directory = "./dist"
binding = "ASSETS"

# KV 命名空间：先执行 `npx wrangler kv namespace create FACTOR_KV`，把返回的 id 填到下面
[[kv_namespaces]]
binding = "FACTOR_KV"
id = "b6bae7de0f4b493786ff01c55498bdd4"

# 定时：交易时段每分钟抓取一次（实时）
#   UTC 01:00-03:59 → 北京 09:00-11:59
#   UTC 05:00-07:59 → 北京 13:00-15:59
#   每日触发 6×60 = 360 次（Cloudflare 免费版 Cron 上限 500 次/天）
# 另加 15:12 兜底定稿（Worker 失败时补一次）
[triggers]
crons = ["*/1 1-3,5-7 * * 1-5", "12 7 * * 1-5"]
