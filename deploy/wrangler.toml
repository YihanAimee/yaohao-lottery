name = "yaohao-lottery"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# 静态资源（页面）
[assets]
directory = "./dist"
binding = "ASSETS"

# KV 命名空间：先执行 `npx wrangler kv namespace create FACTOR_KV`，把返回的 id 填到下面
[[kv_namespaces]]
binding = "FACTOR_KV"
id = "b6bae7de0f4b493786ff01c55498bdd4"

# 定时：Cloudflare 免费版 cron 不支持小于每小时（实测 */1 与 * 1-3 形式均不触发），
# 因此 Worker 只做「每小时后台保底」；分钟级实时刷新由 Pages 边缘惰性刷新承担
#   "2 * * * 1-5"  → 每小时第 2 分钟（UTC），即北京时间每小时 10 分
#   "30 7 * * 1-5" → 北京时间 15:30 收盘后定稿补抓
[triggers]
crons = ["2 * * * 1-5", "30 7 * * 1-5"]
