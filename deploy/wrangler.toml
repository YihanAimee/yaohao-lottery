name = "yaohao-lottery"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# 静态资源（页面）
[assets]
directory = "./dist"
binding = "ASSETS"

# KV 命名空间：先执行 `npx wrangler kv namespace create FACTOR_KV`，把返回的 id 填到下面
[[kv_namespaces]]
binding = "FACTOR_KV"
id = "b6bae7de0f4b493786ff01c55498bdd4"

# 定时：交易时段每分钟抓取一次（实时）
#   UTC 01-03 点 → 北京 09-11 点
#   UTC 05-07 点 → 北京 13-15 点
#   每日 6×60 = 360 次（Cloudflare 免费版 Cron 上限 500 次/天）
#   表达式拆成两条简单形式，避开 */1 与多范围列表的解析兼容问题
# 另加 15:12 兜底定稿
[triggers]
crons = ["* 1-3 * * 1-5", "* 5-7 * * 1-5", "12 7 * * 1-5"]
